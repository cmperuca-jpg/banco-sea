name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Validar projeto
        run: npm run check

      - name: Gerar FusionSistema-Setup.exe
        run: npm run desktop:dist

      - name: Salvar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FusionSistema-Windows
          path: |
            release/FusionSistema-Setup.exe
            release/FusionSistema-Setup.exe.blockmap
            release/latest.yml

      - name: Publicar atualização
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FusionSistema-Setup.exe
            release/FusionSistema-Setup.exe.blockmap
            release/latest.yml
